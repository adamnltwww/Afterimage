name: Afterimage
options:
  bundleIdPrefix: com.adamnltwww
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  Afterimage:
    type: application
    platform: iOS
    sources: [Afterimage]
    info:
      path: build/Generated-App-Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamnltwww.afterimage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AFTERIMAGE
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '0.9.6'
        CURRENT_PROJECT_VERSION: '1'
    scheme:
      testTargets: [AfterimageTests, AfterimageUITests]
  AfterimageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Afterimage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AfterimageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Afterimage
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
